name: Release

# Pushing a tag like v1.2.3 builds the binaries, publishes a GitHub release
# with checksums and build provenance, and updates the Homebrew formula.
#
# Run by hand with a tag that is already released, it leaves the release
# alone and only updates the formula, from the release's own checksums.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag to publish the Homebrew formula for
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Is it released already?
        id: released
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "not a release tag: $TAG"; exit 1 ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
            mkdir -p dist
            gh release download "$TAG" --pattern checksums.txt --dir dist
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.released.outputs.yes != 'true'
        with:
          go-version-file: go.mod

      - name: Test
        if: steps.released.outputs.yes != 'true'
        run: go test -race -count=1 ./...

      - name: Build
        if: steps.released.outputs.yes != 'true'
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/}
            name="audiobook-fetch_${TAG#v}_${os}_${arch}"
            binary=audiobook-fetch
            [ "$os" = windows ] && binary=audiobook-fetch.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "build/$name/$binary" ./cmd/audiobook-fetch
            cp README.md LICENSE "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -q -r "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          cat dist/checksums.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.released.outputs.yes != 'true'
        with:
          subject-path: dist/*

      - name: Publish the release
        if: steps.released.outputs.yes != 'true'
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag

      # The tap's formula is generated here and pushed with a deploy key
      # that can write to the tap and nothing else. Without the key (a
      # fork, say) the release is still complete; only this step is skipped.
      - name: Update the Homebrew formula
        if: env.TAP_DEPLOY_KEY != ''
        run: |
          sum() { grep " audiobook-fetch_${TAG#v}_$1.tar.gz\$" dist/checksums.txt | cut -d' ' -f1; }
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/audiobook-fetch_${TAG#v}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:broots144/homebrew-tap.git tap
          mkdir -p tap/Formula
          cat > tap/Formula/audiobook-fetch.rb <<FORMULA
          # Generated by the release workflow of ${GITHUB_REPOSITORY}; edits here are overwritten.
          class AudiobookFetch < Formula
            desc "Turn a list of audiobooks into checked files in a folder"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${TAG#v}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}_darwin_arm64.tar.gz"
                sha256 "$(sum darwin_arm64)"
              end
              on_intel do
                url "${base}_darwin_amd64.tar.gz"
                sha256 "$(sum darwin_amd64)"
              end
            end

            on_linux do
              on_arm do
                url "${base}_linux_arm64.tar.gz"
                sha256 "$(sum linux_arm64)"
              end
              on_intel do
                url "${base}_linux_amd64.tar.gz"
                sha256 "$(sum linux_amd64)"
              end
            end

            def install
              bin.install "audiobook-fetch"
            end

            def caveats
              <<~EOS
                Optional extras: brew install ffmpeg whisper-cpp
                Then run: audiobook-fetch doctor
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/audiobook-fetch version")
            end
          end
          FORMULA
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/audiobook-fetch.rb
          git commit -m "Update audiobook-fetch to ${TAG#v}"
          git push origin HEAD:main
          rm -f ~/.ssh/tap
